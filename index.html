<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>IEM GROUP · Inventario Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg-gradient: linear-gradient(145deg, #0b1a2e 0%, #1a2d44 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --text-primary: #e8edf4;
            --text-secondary: #a0b8d0;
            --text-muted: #6a8aaa;
            --heading-color: #b8d4f0;
            --accent: #4a8aba;
            --accent-light: #6aaee0;
            --success: #3baa6a;
            --warning: #d49a3a;
            --danger: #d45a5a;
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.12);
            --table-header-bg: rgba(20, 50, 80, 0.4);
            --table-row-alt: rgba(255, 255, 255, 0.02);
            --divider: rgba(255, 255, 255, 0.06);
        }

        body.light-theme {
            --bg-gradient: linear-gradient(145deg, #eef2f7 0%, #dbe4ee 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --text-primary: #1a2a44;
            --text-secondary: #3a5a7a;
            --text-muted: #6a8aaa;
            --heading-color: #1a4b7a;
            --accent: #2a6a9a;
            --accent-light: #4a8aba;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: rgba(0, 0, 0, 0.1);
            --table-header-bg: rgba(42, 106, 154, 0.1);
            --table-row-alt: rgba(0, 0, 0, 0.01);
            --divider: rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: var(--font);
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            line-height: 1.5;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            box-shadow: var(--card-shadow);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo .iem { font-size: 1.6rem; font-weight: 800; color: var(--heading-color); }
        .logo .laive { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); background: rgba(74, 138, 186, 0.2); padding: 0.2rem 0.8rem; border-radius: 20px; }

        .actions-nav { display: flex; gap: 0.75rem; align-items: center; }

        .btn {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-light); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-secondary); }

        .search-box {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: border 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow-x: auto;
            box-shadow: var(--card-shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: var(--table-header-bg);
            color: var(--heading-color);
            padding: 1rem;
            font-weight: 600;
            border-bottom: 1px solid var(--divider);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--divider);
            color: var(--text-secondary);
        }

        tr:nth-child(even) { background: var(--table-row-alt); }

        .status-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-ok { background: rgba(59, 170, 106, 0.2); color: #5cd68a; }
        .status-low { background: rgba(214, 154, 58, 0.2); color: #f3b757; }

        @media (max-width: 768px) {
            .header { border-radius: 20px; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 1rem; border: 1px solid var(--card-border); border-radius: 12px; padding: 0.5rem; }
            td { text-align: right; padding-left: 50%; position: relative; border-bottom: none; }
            td::before {
                content: attr(data-label);
                position: absolute; left: 1rem; width: 45%;
                text-align: left; font-weight: 600; color: var(--heading-color);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="logo">
            <span class="iem">IEM GROUP</span>
            <span class="laive">Inventario</span>
        </div>
        <div class="actions-nav">
            <button class="btn btn-outline" id="themeToggle" onclick="toggleTheme()">🌓 Tema</button>
            <button class="btn btn-success" onclick="document.getElementById('excelFile').click()">📥 Importar</button>
            <button class="btn btn-primary" onclick="exportToExcel()">📤 Exportar</button>
            <input type="file" id="excelFile" style="display:none" accept=".xlsx, .xls" onchange="importFromExcel(event)">
        </div>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por código, descripción, familia o ubicación..." onkeyup="filterTable()">

    <div class="table-container">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción del Artículo</th>
                    <th>Familia</th>
                    <th>Ubicación</th>
                    <th>Stock Real</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
                <tr>
                    <td data-label="Código">IEM-001</td>
                    <td data-label="Descripción del Artículo">Cable de Cobre de Alta Tensión 16mm</td>
                    <td data-label="Familia">Conductores</td>
                    <td data-label="Ubicación">Almacén A - Estante 2</td>
                    <td data-label="Stock Real">45</td>
                    <td data-label="Estado"><span class="status-badge status-ok">Óptimo</span></td>
                </tr>
                <tr>
                    <td data-label="Código">IEM-002</td>
                    <td data-label="Descripción del Artículo">Disyuntor Termomagnético 32A</td>
                    <td data-label="Familia">Protecciones</td>
                    <td data-label="Ubicación">Almacén B - Estante 1</td>
                    <td data-label="Stock Real">3</td>
                    <td data-label="Estado"><span class="status-badge status-low">Stock Bajo</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
    
    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#inventoryBody tr');

        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(query) ? '' : 'none';
        });
    }

    function importFromExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            renderTableData(jsonData);
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTableData(data) {
        const body = document.getElementById('inventoryBody');
        body.innerHTML = '';

        data.forEach(item => {
            const stock = parseInt(item['Stock Real'] || item['Stock'] || 0);
            const statusClass = stock > 5 ? 'status-ok' : 'status-low';
            const statusText = stock > 5 ? 'Óptimo' : 'Stock Bajo';

            const row = `<tr>
                <td data-label="Código">${item['Código'] || 'N/A'}</td>
                <td data-label="Descripción del Artículo">${item['Descripción del Artículo'] || item['Descripción'] || 'N/A'}</td>
                <td data-label="Familia">${item['Familia'] || 'Generales'}</td>
                <td data-label="Ubicación">${item['Ubicación'] || 'Sin Asignar'}</td>
                <td data-label="Stock Real">${stock}</td>
                <td data-label="Estado"><span class="status-badge ${statusClass}">${statusText}</span></td>
            </tr>`;
            body.innerHTML += row;
        });
    }

    function exportToExcel() {
        const table = document.getElementById('inventoryTable');
        const wb = XLSX.utils.table_to_book(table, { sheet: "Inventario_Actual" });
        XLSX.writeFile(wb, `Inventario_IEM_GROUP.xlsx`);
    }
</script>

</body>
</html>
