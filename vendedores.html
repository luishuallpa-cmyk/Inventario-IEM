<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0A784C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="IEM GROUP — Sugerencia de pedido (vendedores)">
  <title>IEM · Pedidos vendedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4.1">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4.1">
  <link rel="stylesheet" href="vendedores.css?v=4.1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="globalLoading" class="global-loading" aria-live="polite" aria-busy="true" aria-label="Cargando">
  <div class="gl-dots" aria-hidden="true"><span></span><span></span><span></span></div>
</div>
  <!-- LOGIN (mismo estilo que inventario) -->
  <div id="loginScreen" class="login-wrap">
    <button type="button" class="theme-toggle" id="themeToggleBtn" title="Cambiar tema">🌙</button>
    <div class="card login-card">
      <div class="login-logo">
        <img src="./logo-iem-ventas.png" alt="IEM GROUP · Laive" class="logo-img" width="160" height="76" decoding="async">
      </div>
      <h1>Pedidos vendedor</h1>
      <p class="sub">Sugerencia de pedido · IEM GROUP</p>
      <div class="field">
        <label for="vUser">Usuario (código)</label>
        <input id="vUser" type="text" inputmode="numeric" autocomplete="username" placeholder="Ej. 400">
      </div>
      <div class="field">
        <label for="vPass">Clave</label>
        <input id="vPass" type="password" autocomplete="current-password" placeholder="••••">
      </div>
      <button type="button" class="btn btn-primary" id="vLoginBtn">Entrar</button>
      <p class="muted" style="margin-top:0.75rem;text-align:center;font-size:0.78rem;">Misma cuenta Auth que inventario (rol vendedor)</p>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="container hidden">
    <div class="header-bar">
      <div class="header-left">
        <img class="header-logo" src="./logo-iem-ventas.png" alt="IEM GROUP" width="48" height="40" decoding="async">
        <div class="who" id="vWho">—</div>
      </div>
      <div class="header-right">
        <button type="button" class="theme-toggle" id="themeToggleBtnApp" title="Cambiar tema">🌙</button>
        <button type="button" class="btn btn-outline" id="vLogoutBtn">Salir</button>
      </div>
    </div>

    <div class="layout-main" id="vLayoutMain">
    <div class="card" id="vCatalogCard">
      <div class="card-title">
        <h2>Catálogo</h2>
        <span class="badge">Sin PROM / CMB</span>
      </div>
      <div class="filtros" id="vFiltros">
        <button type="button" class="filtro-btn active" data-tipo="">Todos</button>
        <button type="button" class="filtro-btn" data-tipo="FRIOS">Fríos</button>
        <button type="button" class="filtro-btn" data-tipo="SECOS">Secos</button>
      </div>
      <div class="search-row">
        <input type="search" id="vSearch" placeholder="Código, fábrica o nombre…" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="catalog-count" id="vCatalogCount">Catálogo: —</div>
      <div class="result-list" id="vResults"></div>
    </div>

    <div class="producto-card hidden" id="vProductoCard">
      <div class="pc-top">
        <img class="pc-img" id="vProdImg" src="" alt="" style="display:none;" loading="lazy" decoding="async">
        <div class="pc-text">
          <div class="pc-name" id="vProdName">—</div>
          <div class="pc-codes" id="vProdCodes">Cód: — · Cód. Fábrica: —</div>
        </div>
      </div>
      <div class="qty-row">
        <div class="field">
          <label for="vCajas">Cajas</label>
          <input id="vCajas" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="vUnidades">Unidades</label>
          <input id="vUnidades" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
      </div>
      <p class="muted" id="vFactor">Factor: —</p>
      <div class="pc-actions">
        <button type="button" class="btn btn-success" id="vAddBtn">Agregar al pedido</button>
        <button type="button" class="btn btn-outline" id="vClearProd">← Cambiar producto</button>
      </div>
    </div>
    </div><!-- /layout-main -->

    <div class="card" id="vPedidoCard">
      <div class="card-title">
        <h2>Pedido sugerido</h2>
        <span class="badge" id="vPedidoBadge">0 ítems</span>
      </div>
      <div class="pedido-list" id="vPedidoList">
        <p class="muted">Aún no hay productos. Busca y agrega del catálogo.</p>
      </div>
      <div class="totales" id="vTotales">0 cajas · 0 unidades</div>
      <div class="field">
        <label for="vNotas">Notas (opcional)</label>
        <textarea id="vNotas" placeholder="Observaciones para almacén…"></textarea>
      </div>
      <button type="button" class="btn btn-primary" id="vSendBtn">Enviar sugerencia a almacén</button>
    </div>
  </div>

  <div id="vToast" class="toast hidden"></div>

  <script src="config.js?v=4.1"></script>
  <script src="app-vendedores.js?v=3.3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=4.1').catch(function () {});
    }
  </script>
</body>
</html>
